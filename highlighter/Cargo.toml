[package]
name = "hx-highlight"
version = "0.1.0"
edition = "2021"
description = "Highlights source text using Helix's grammars and queries (via tree-house), emitting scope spans as JSON"

[dependencies]
tree-house = { version = "=0.3.0", default-features = false }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
